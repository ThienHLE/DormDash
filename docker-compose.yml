services:
  ui:
    build:
      context: ./WebUI
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      - PORT=3000
    restart: unless-stopped
